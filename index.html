<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sales Report – Back Office</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6fc;--card:#fff;--tx:#0b1630;--mut:#6b7893;--pri:#2457f5;--soft:#eaf0ff;--bd:#e3e8f3;--ok:#12a150;--bad:#e5384f;--warn:#d98a06;--hd1:#1a44cc;--hd2:#2f6df5;
--sh:0 1px 2px rgba(16,28,72,.04),0 10px 32px rgba(16,28,72,.07);--side:linear-gradient(185deg,#2457f5 0%,#1637a8 55%,#0d2160 100%)}
*{box-sizing:border-box}
body{margin:0;font-family:"Plus Jakarta Sans",system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
.hide{display:none!important}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
/* login */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--side);padding:20px}
.lbox{background:#fff;padding:34px;border-radius:20px;width:min(420px,100%);box-shadow:0 30px 80px rgba(0,0,0,.25)}
.brandtx{letter-spacing:.32em;font-weight:800;color:var(--pri);font-size:14px}
.brandtx span{color:#8aa0d6;font-weight:600}
.lbox h1{margin:14px 0 4px;font-size:22px}
.lbox p{margin:0 0 22px;color:var(--mut);font-size:13px}
label{display:block;font-size:12px;font-weight:700;color:var(--mut);margin:0 0 5px}
.inp{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:#fff}
.inp:focus{outline:3px solid #dbe5ff;border-color:var(--pri)}
.btn{display:inline-flex;align-items:center;gap:7px;border:0;border-radius:10px;padding:10px 16px;cursor:pointer;font-weight:700;background:var(--pri);color:#fff;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn.sec{background:#fff;color:var(--tx);border:1px solid var(--bd)}
.btn.red{background:var(--bad)}
.btn.sm{padding:7px 12px;font-size:13px}
.btn:disabled{opacity:.6;cursor:wait}
.btn svg.i{width:17px;height:17px}
.err{color:var(--bad);font-size:13px;margin-top:10px;min-height:18px}
/* header */
.top{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--bd);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:12px 22px;gap:12px}
.ttl b{display:block;font-size:19px;font-weight:800}
.ttl small{color:var(--mut);font-size:12px}
.ttl .bc{color:var(--pri);cursor:pointer;font-weight:600}
.tright{display:flex;align-items:center;justify-content:flex-end;gap:10px}
.upd{font-size:12px;color:var(--mut)}
.av{display:flex;align-items:center;gap:8px;padding-left:12px;border-left:1px solid var(--bd);font-weight:800;font-size:12px}
.av i{font-style:normal;width:32px;height:32px;border-radius:50%;background:var(--pri);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px}
.ib{width:38px;height:38px;border-radius:11px;border:1px solid var(--bd);background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--tx)}
.ib:hover{background:var(--soft)}
main{padding:20px 22px 120px;max-width:1400px;margin:0 auto}
.sec-t{font-size:11px;font-weight:800;color:var(--mut);letter-spacing:.08em;text-transform:uppercase;margin:18px 0 10px}
/* chips */
.chips{display:flex;gap:10px;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:9px;background:#fff;border:1px solid var(--bd);border-radius:999px;padding:7px 16px 7px 7px;cursor:pointer;font-weight:700;font-size:13px;box-shadow:var(--sh)}
.chip:hover{border-color:#bfd0ff}
.chip span{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.chip span svg.i{width:16px;height:16px}
.c1{background:#eaf0ff;color:#2457f5}.c2{background:#fff1e6;color:#e46b12}.c3{background:#e8f8ee;color:#12a150}.c4{background:#fdeef1;color:#e5384f}.c5{background:#f3edff;color:#7c4dff}
/* module cards */
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.mcard{background:#fff;border:1px solid var(--bd);border-radius:16px;padding:16px;cursor:pointer;box-shadow:var(--sh);transition:.15s;min-height:148px;display:flex;flex-direction:column}
.mcard:hover{transform:translateY(-2px);border-color:#bfd0ff}
.mic{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,var(--hd2),var(--hd1));color:#fff;display:flex;align-items:center;justify-content:center;margin-bottom:14px;box-shadow:0 6px 14px rgba(36,87,245,.25)}
.mcard b{font-size:15px;font-weight:800}
.mcard p{margin:5px 0 0;color:var(--mut);font-size:12px;line-height:1.45;flex:1}
.mcard em{font-style:normal;color:var(--pri);font-weight:800;font-size:11px;margin-top:10px}
/* dock */
.dock{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:rgba(39,52,105,.9);backdrop-filter:blur(12px);border-radius:22px;padding:7px;display:flex;gap:4px;z-index:15;box-shadow:0 14px 40px rgba(13,33,96,.35)}
.dock a{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#d7e0ff;cursor:pointer;position:relative}
.dock a:hover{background:rgba(255,255,255,.08)}
.dock a.on{background:#fff;color:var(--pri)}
.dock a.home.on{background:rgba(255,255,255,.18);color:#fff}
.dock a.home.on:after{content:"";position:absolute;bottom:3px;width:4px;height:4px;border-radius:50%;background:#fff}
/* sidebar (mode samping) */
.sidebar{display:none}
body.side .sidebar{display:flex;flex-direction:column;position:fixed;left:0;top:0;bottom:0;width:74px;background:var(--side);z-index:16;padding:10px 0;overflow-y:auto}
body.side .top, body.side main{margin-left:74px}
body.side main{padding-bottom:30px}
body.side .dock{display:none}
.sb-brand{color:#fff;font-size:9.5px;font-weight:800;letter-spacing:.08em;text-align:center;padding:4px 0 12px}
.sb-brand span{color:#b9c8ff;font-weight:600}
.sidebar a{display:flex;flex-direction:column;align-items:center;gap:4px;margin:3px 7px;padding:9px 2px;border-radius:12px;color:#dbe4ff;font-size:9.5px;font-weight:700;text-align:center;cursor:pointer;line-height:1.15}
.sidebar a svg.i{width:19px;height:19px}
.sidebar a:hover{background:rgba(255,255,255,.1);color:#fff}
.sidebar a.on{background:#fff;color:var(--pri);box-shadow:0 6px 14px rgba(0,0,0,.15)}
.sidebar .sb-sp{flex:1}
.dock a.tog{color:#b9c8ff}
/* logo */
.logos{display:flex;align-items:center;gap:14px}
.logos img{display:block;object-fit:contain}
.lbox .logos{margin-bottom:18px}
.hbrand{display:flex;align-items:center;gap:14px}
.hbrand .logos{gap:10px;padding-right:14px;border-right:1px solid var(--bd)}
.rpt .logos{margin-bottom:8px;gap:12px}
/* harga di beranda */
.hp{background:#fff;border:1px solid var(--bd);border-radius:16px;box-shadow:var(--sh);padding:16px;margin-top:24px}
.hp .hph{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.hp .hph b{font-size:15px;font-weight:800}
.hp .hph .kv{background:var(--soft);border-radius:8px;padding:5px 10px;font-size:12px;font-weight:800}
.hp .hph .kv small{color:var(--mut);font-weight:600;margin-right:4px}
.hgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.hcell{border:1px solid var(--bd);border-radius:12px;padding:10px 12px}
.hcell b{display:block;font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hcell small{display:block;color:var(--mut);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:14px}
.hcell .rp{font-size:16px;font-weight:800;color:var(--pri);margin-top:6px}
.hcell .us{font-size:11px;color:var(--mut)}
/* popup modul */
#mpop .mbg{z-index:25;align-items:center;background:rgba(11,22,48,.35)}
.mpop{background:#fff;border-radius:18px;width:min(380px,100%);padding:18px;box-shadow:0 30px 80px rgba(13,33,96,.3)}
.mpop .mph{display:flex;align-items:center;gap:10px;padding-bottom:14px;border-bottom:1px solid var(--bd);margin-bottom:14px}
.mpop .mph b{font-size:19px;font-weight:800;flex:1;white-space:nowrap}
.mpop .mph input{width:150px;min-width:0;border:0;background:#eef2fb;border-radius:10px;padding:9px 12px;font-size:13px}
.mpop .mph input:focus{outline:2px solid #dbe5ff}
.mpop .mph button{width:34px;height:34px;border-radius:10px;border:1px solid var(--bd);background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center}
.mpop .mph button svg.i{width:16px;height:16px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{border:1px solid var(--bd);border-radius:14px;padding:16px 8px 12px;text-align:center;cursor:pointer;transition:.15s}
.tile:hover{border-color:#9fd8b5;background:#f6fcf8}
.tile span{width:40px;height:40px;border-radius:50%;background:#e3f6ea;color:#12a150;display:flex;align-items:center;justify-content:center;margin:0 auto 10px}
.tile span svg.i{width:18px;height:18px}
.tile b{display:block;font-size:12.5px;font-weight:800;line-height:1.3}
.tile small{display:block;font-size:9.5px;color:var(--mut);font-weight:700;letter-spacing:.06em;margin-top:4px}
.tiles .none{grid-column:1/-1;text-align:center;color:var(--mut);padding:14px;font-size:13px}
.dock a[title]:hover:before{content:attr(title);position:absolute;bottom:54px;background:#0b1630;color:#fff;font-size:11px;padding:4px 8px;border-radius:6px;white-space:nowrap}
/* panel/table */
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.bar .inp{width:auto;min-width:140px}
.bar .grow{flex:1;min-width:200px}
.panel{background:#fff;border:1px solid var(--bd);border-radius:16px;overflow:hidden;box-shadow:var(--sh);margin-bottom:16px}
.ph{padding:14px 16px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;gap:10px}
.ph b{font-size:15px;font-weight:800}
.ph small{color:var(--mut)}
.tw{overflow:auto}
.tw.lim{max-height:calc(100vh - 250px)}
table{border-collapse:collapse;width:100%}
th,td{padding:10px 12px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top;white-space:nowrap}
th{position:sticky;top:0;background:#f7f9fe;font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;font-weight:800;z-index:1}
tbody tr.ck{cursor:pointer}
tbody tr.ck:hover{background:#f3f6ff}
tfoot td{font-weight:800;background:#f7f9fe}
td.n,th.n{text-align:right}
td.wrap{white-space:normal;min-width:220px;max-width:360px}
.lk{color:var(--pri);font-weight:700;cursor:pointer;text-decoration:none}
.lk:hover{text-decoration:underline}
.num{color:var(--pri);font-weight:800;cursor:pointer;border-radius:6px;padding:2px 6px;margin:-2px -6px}
.num:hover{background:var(--soft)}
.badge{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:800}
.b-ok{background:#e3f6ea;color:#0d7a3c}.b-mut{background:#eef1f7;color:#6b7893}.b-pr{background:#fff3df;color:#a05f00}.b-bl{background:var(--soft);color:var(--pri)}
.sum{padding:11px 16px;font-size:13px;color:var(--mut);display:flex;gap:20px;flex-wrap:wrap;background:#f7f9fe}
.sum b{color:var(--tx)}
.empty{padding:34px;text-align:center;color:var(--mut)}
/* kpi */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--bd);border-radius:16px;padding:16px;box-shadow:var(--sh);cursor:pointer;transition:.15s}
.kpi:hover{transform:translateY(-2px);border-color:#bfd0ff}
.kpi .kh{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:12px;font-weight:700}
.kpi .kh span{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center}
.kpi .kh svg.i{width:17px;height:17px}
.kpi .kv{font-size:26px;font-weight:800;margin-top:10px}
.kpi .ks{font-size:12px;color:var(--mut);margin-top:3px}
.kpi .kl{font-size:11px;color:var(--pri);font-weight:800;margin-top:8px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.bars{padding:14px 16px}
.brow{display:grid;grid-template-columns:130px 1fr 130px;gap:10px;align-items:center;margin-bottom:10px;font-size:13px;cursor:pointer}
.brow:hover .bl{color:var(--pri)}
.bl{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btrack{background:#eef1f7;border-radius:6px;height:10px;overflow:hidden;margin:2px 0}
.btrack div{height:100%;border-radius:6px}
.bv{text-align:right;color:var(--mut);font-size:12px}
.leg{display:flex;gap:14px;font-size:12px;color:var(--mut);padding:0 16px 12px}
.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.vbars{display:flex;align-items:flex-end;gap:10px;height:190px;padding:16px 16px 0}
.vcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;cursor:pointer;min-width:30px}
.vcol .vb{display:flex;gap:3px;align-items:flex-end;height:100%}
.vcol .vb div{width:14px;border-radius:5px 5px 0 0;min-height:2px}
.vcol small{font-size:11px;color:var(--mut);padding:6px 0 12px}
.note{font-size:12px;color:var(--mut);margin:-6px 0 14px}
/* modal */
.mbg{position:fixed;inset:0;background:rgba(11,22,48,.5);display:flex;align-items:flex-start;justify-content:center;padding:28px 12px;overflow:auto}
#drill .mbg{z-index:30}#modal .mbg{z-index:40}#prev .mbg{z-index:50}
.modal{background:#fff;border-radius:18px;width:min(840px,100%);box-shadow:0 30px 80px rgba(0,0,0,.3)}
.modal.xl{width:min(1250px,100%)}
.mh{padding:16px 20px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;gap:10px}
.mh b{font-size:16px;font-weight:800}
.mh small{display:block;color:var(--mut);font-weight:500;font-size:12px;margin-top:2px}
.mx{cursor:pointer;color:var(--mut);display:flex}
.mb{padding:18px 20px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mb .full{grid-column:1/-1}
.mb textarea{min-height:72px;resize:vertical}
.chk{display:flex;align-items:center;gap:8px;padding-top:8px}
.mf{padding:14px 20px;border-top:1px solid var(--bd);display:flex;gap:10px;justify-content:flex-end;align-items:center}
.mf .l{margin-right:auto}
.meta{font-size:12px;color:var(--mut)}
.dbody{padding:16px 20px}
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#0b1630;color:#fff;padding:10px 18px;border-radius:10px;z-index:60;font-size:13px;font-weight:600}
/* harga */
.hin{display:grid;grid-template-columns:repeat(4,minmax(140px,1fr));gap:14px;padding:16px}
td input.inp{padding:6px 8px;width:110px;text-align:right}
/* report (A4) */
.rwrap{overflow:auto;background:#e9edf6;border-radius:16px;padding:20px;display:flex;justify-content:center}
.rpt{width:794px;background:#fff;color:#0b1630;padding:36px 38px;font-size:11.5px;box-shadow:0 10px 30px rgba(0,0,0,.12)}
.rpt .rh{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid var(--pri);padding-bottom:12px;margin-bottom:16px}
.rpt .rh h1{margin:4px 0 0;font-size:20px;font-weight:800}
.rpt .rh .r{text-align:right;color:var(--mut);font-size:11px;line-height:1.6}
.rpt h2{font-size:13px;font-weight:800;color:var(--pri);margin:18px 0 8px;text-transform:uppercase;letter-spacing:.04em}
.rpt table{font-size:10.5px}
.rpt th{position:static;padding:6px 6px;font-size:9px;white-space:normal}
.rpt td{padding:6px 6px;white-space:normal;overflow-wrap:break-word}
.rpt .rk{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.rpt .rk div{border:1px solid var(--bd);border-radius:10px;padding:9px}
.rpt .rk small{display:block;color:var(--mut);font-size:9.5px;font-weight:700;text-transform:uppercase}
.rpt .rk b{font-size:16px;display:block;margin-top:3px}
.rpt .rk span{font-size:9.5px;color:var(--mut)}
.rpt .rf{margin-top:22px;padding-top:10px;border-top:1px solid var(--bd);color:var(--mut);font-size:9.5px;display:flex;justify-content:space-between}
.rpt .kv3{display:flex;gap:10px;margin-bottom:8px}
.rpt .kv3 div{background:var(--soft);border-radius:8px;padding:7px 12px;font-weight:700}
.rpt .kv3 small{color:var(--mut);font-weight:600;margin-right:5px}
.ropts{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:13px;font-weight:600}
.ropts label{display:flex;gap:6px;align-items:center;margin:0;color:var(--tx);font-size:13px}
@media (max-width:900px){
  .top{grid-template-columns:1fr auto;padding:10px 14px}
  .top .brandtx{display:none}
  .upd,.av span{display:none}
  main{padding:14px 12px 110px}
  .g2{grid-template-columns:1fr}
  .mb{grid-template-columns:1fr}
  .hin{grid-template-columns:1fr 1fr}
  .brow{grid-template-columns:90px 1fr 90px}
  .dock{max-width:96vw;overflow-x:auto}
}
</style>
</head>
<body>

<div id="login">
  <div class="lbox">
    <div class="logos" id="lLogos"></div>
    <div class="brandtx">SALES <span>REPORT</span></div>
    <h1>Masuk Back Office</h1>
    <p>Laporan sales GAN &amp; SWM</p>
    <div style="margin-bottom:12px"><label>URL Web App</label><input id="lUrl" class="inp" placeholder="https://script.google.com/macros/s/.../exec"></div>
    <div style="margin-bottom:18px"><label>Token</label><input id="lTok" class="inp" type="password" onkeydown="if(event.key==='Enter')doLogin()"></div>
    <button class="btn" id="lBtn" style="width:100%;justify-content:center" onclick="doLogin()">Masuk</button>
    <div class="err" id="lErr"></div>
  </div>
</div>

<div id="app" class="hide">
  <header class="top">
    <div class="ttl" id="ttl"></div>
    <div class="hbrand"><div class="logos" id="hLogos"></div><div class="brandtx">SALES <span>REPORT</span></div></div>
    <div class="tright">
      <span class="upd" id="upd"></span>
      <div class="av"><i>SPV</i><span>SPV SALES</span></div>
      <button class="ib" title="Muat ulang data" onclick="reload()" id="icR"></button>
      <button class="ib" title="Keluar" onclick="logout()" id="icL"></button>
    </div>
  </header>
  <main id="content"></main>
  <nav class="dock" id="dock"></nav>
  <nav class="sidebar" id="sidebar"></nav>
</div>

<div id="mpop" class="hide"></div>
<div id="drill" class="hide"></div>
<div id="modal" class="hide"></div>
<div id="prev" class="hide"></div>
<div id="toast" class="hide"></div>

<script>

/* ================= UTIL ================= */
function ls(k, v){ try{ if(v===undefined) return localStorage.getItem(k); if(v===null) localStorage.removeItem(k); else localStorage.setItem(k, v); }catch(e){ return null; } }
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const n = Number(v); return (v===''||v==null||isNaN(n)) ? 0 : n; };
const has = v => v!=='' && v!=null && !isNaN(Number(v));
const fmtN = (v, d) => !has(v) ? '' : Number(v).toLocaleString('id-ID', {maximumFractionDigits: d==null?0:d});
const fmtRp = v => 'Rp ' + (fmtN(v)||'0');
const fmtKg = v => (fmtN(v)||'0') + ' kg';
const fmtD = s => { const m = String(s||'').match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? m[3]+'/'+m[2]+'/'+m[1] : String(s||''); };
const today = () => { const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const ymd = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const BULAN = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const fmtBln = ym => { const p = ym.split('-'); return BULAN[+p[1]-1]+' '+p[0].slice(2); };
const tglPanjang = s => { const m = String(s||'').match(/^(\d{4})-(\d{2})-(\d{2})/); if(!m) return s||''; return (+m[3])+' '+['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'][+m[2]-1]+' '+m[1]; };
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.remove('hide'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.add('hide'),2600); }
const normCo = s => String(s||'').toLowerCase().replace(/\(.*?\)/g,'').replace(/[^a-z0-9]/g,'').replace(/^pt/,'').replace(/tbk$/,'');
const normAlloy = s => String(s||'').toUpperCase().replace(/ALUMINIUM|ALUMUNIUM|ALUMINUM|ALLOY|INGOT/g,' ').replace(/%/g,'').replace(/([A-Z])\s*-\s*(\d)/g,'$1$2').replace(/\b([A-Z]{1,3})\s+(\d)/g,'$1$2').replace(/\s+/g,' ').trim() || '(tanpa alloy)';
const visited = r => r.statusKunjungan==='SUDAH DIKUNJUNGI';

async function api(action, payload){
  const res = await fetch(S.url, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(Object.assign({token:S.token, action}, payload||{}))});
  const j = await res.json();
  if(!j.ok) throw new Error(j.error || 'Gagal');
  return j;
}

async function doLogin(){
  const url = document.getElementById('lUrl').value.trim(), tok = document.getElementById('lTok').value.trim();

  err.textContent = '';
  if(!url || !tok){ err.textContent = 'URL dan token wajib diisi'; return; }
  S.url = url; S.token = tok;
  btn.disabled = true; btn.textContent = 'Memuat...';
  try{
    await loadAll();
    ls('sr_url', url); ls('sr_tok', tok);

  }catch(e){ err.textContent = e.message; }

}

async function loadAll(){

    ttl.innerHTML = '<b>Beranda</b><small>Pilih menu yang ingin dibuka</small>';

/* ================= RUMUS HARGA ================= */
function rumus(fm){
  if(fm.basis==='Harga Pasar') return 'Harga pasar (manual)';
  const a = has(fm.lmeMin)?fm.lmeMin:100, b = fm.lmeMax;
  let t = 'LME × ' + fmtN(a,2) + (has(b) && Number(b)!=Number(a) ? '–'+fmtN(b,2) : '') + '%';
  if(fm.pakaiMjp==='Ya') t += ' + MJP';
  if(has(fm.premium) && Number(fm.premium)) t += ' + $' + fmtN(fm.premium,2);
  return t;
}
function hitung(fm, lme, mjp, kurs){
  const o = {hargaUsdMin:'', hargaUsdMax:'', hargaRpMin:'', hargaRpMax:''};
  if(fm.basis==='Harga Pasar' || !num(lme)) return o;
  const add = (fm.pakaiMjp==='Ya' ? num(mjp) : 0) + num(fm.premium);
  const pa = has(fm.lmeMin) ? Number(fm.lmeMin) : 100, pb = has(fm.lmeMax) ? Number(fm.lmeMax) : pa;
  o.hargaUsdMin = Math.round((num(lme)*pa/100 + add)*100)/100;
  o.hargaUsdMax = Math.round((num(lme)*pb/100 + add)*100)/100;
  if(num(kurs)){ o.hargaRpMin = Math.round(o.hargaUsdMin*num(kurs)/1000); o.hargaRpMax = Math.round(o.hargaUsdMax*num(kurs)/1000); }
  return o;
}
const rangeTxt = (a, b, d) => !has(a) ? '' : (has(b) && Number(b)!==Number(a) ? fmtN(a,d)+' – '+fmtN(b,d) : fmtN(a,d));

/* ================= DASHBOARD ================= */
function periodRange(per, from, to){
  const d = new Date(), t = ymd(d);
  if(per==='today') return [t, t];
  if(per==='7d'){ const a = new Date(d); a.setDate(a.getDate()-6); return [ymd(a), t]; }
  if(per==='month') return [t.slice(0,8)+'01', t];
  if(per==='lastmonth'){ const a = new Date(d.getFullYear(), d.getMonth()-1, 1), b = new Date(d.getFullYear(), d.getMonth(), 0); return [ymd(a), ymd(b)]; }
  if(per==='year') return [t.slice(0,4)+'-01-01', t];
  if(per==='custom') return [from||'0000-01-01', to||'9999-12-31'];
  return null;
}
function dataset(opt){
  const rg = periodRange(opt.per, opt.from, opt.to);
  const inRange = r => !rg || (/^\d{4}-\d{2}-\d{2}/.test(r.tanggal||'') && r.tanggal>=rg[0] && r.tanggal<=rg[1]);
  const bySales = r => !opt.sales || String(r.sales||'').trim()===opt.sales;
  const byPt = r => !opt.pt || r.pt===opt.pt;
  return {
    rg,
    su: (S.data.surat||[]).filter(bySales),
    pr: (S.data.prospect||[]).filter(r=>bySales(r)&&byPt(r)&&inRange(r)),
    qt: (S.data.quotation||[]).filter(r=>bySales(r)&&byPt(r)&&inRange(r)),
    po: (S.data.po||[]).filter(r=>bySales(r)&&byPt(r)&&inRange(r)),
    ac: (S.data.activity||[]).filter(r=>bySales(r)&&inRange(r))
  };
}
const sumBy = (rows, k) => rows.reduce((a,r)=>a+num(r[k]),0);

function renderDash(){
  const D = S.dash, X = dataset(D);
  const {su, pr, qt, po, ac} = X;
  const sv = su.filter(visited);
  const qV = sumBy(qt,'totalRp'), qK = sumBy(qt,'qty'), pV = sumBy(po,'totalRp'), pK = sumBy(po,'qty');
  const qPriced = qt.filter(r=>num(r.qty)&&num(r.totalRp)), avgQ = sumBy(qPriced,'qty') ? sumBy(qPriced,'totalRp')/sumBy(qPriced,'qty') : 0;
  const prio = su.filter(r=>r.prioritas==='Ya');
  const perLbl = {all:'Semua waktu',today:'Hari ini','7d':'7 hari terakhir',month:'Bulan ini',lastmonth:'Bulan lalu',year:'Tahun ini',custom:'Rentang tanggal'}[D.per];

  const kpi = (icn, cls, label, val, sub, i) => `<div class="kpi" onclick="openReg(${i})"><div class="kh"><span class="${cls}">${ic(icn)}</span>${label}</div><div class="kv">${val}</div><div class="ks">${sub}</div><div class="kl">Lihat rincian ›</div></div>`;

  // per sales
  const sales = salesList().filter(s => !D.sales || s===D.sales);
  const ps = sales.map(s => {
    const f = r => String(r.sales||'').trim()===s;
    const o = {s, su:su.filter(f), pr:pr.filter(f), qt:qt.filter(f), po:po.filter(f), ac:ac.filter(f)};
    o.sv = o.su.filter(visited); o.qv = sumBy(o.qt,'totalRp'); o.qk = sumBy(o.qt,'qty'); o.pv = sumBy(o.po,'totalRp'); o.pk = sumBy(o.po,'qty');
    return o;
  });
  const maxV = Math.max(1, ...ps.map(o=>Math.max(o.qv,o.pv)));

  // per PT
  const pts = ['GAN','SWM'].filter(p=>!D.pt||p===D.pt).map(p => {
    const f = r => r.pt===p; return {p, pr:pr.filter(f), qt:qt.filter(f), po:po.filter(f)};
  });
  // per alloy
  const am = new Map();
  const addA = (t, r) => { const k = normAlloy(r.alloy); if(!am.has(k)) am.set(k,{k, pr:[], qt:[], po:[]}); am.get(k)[t].push(r); };
  pr.forEach(r=>addA('pr',r)); qt.forEach(r=>addA('qt',r)); po.forEach(r=>addA('po',r));
  const al = [...am.values()].sort((a,b)=>(sumBy(b.qt,'totalRp')+sumBy(b.po,'totalRp'))-(sumBy(a.qt,'totalRp')+sumBy(a.po,'totalRp')) || (b.qt.length+b.po.length)-(a.qt.length+a.po.length));
  // per teritory
  const tm = new Map();
  su.forEach(r => { const k = String(r.teritory||'').trim() || '(tanpa teritory)'; if(!tm.has(k)) tm.set(k,[]); tm.get(k).push(r); });
  const ter = [...tm.entries()].sort((a,b)=>b[1].length-a[1].length);
  // top perusahaan
  const top = companies().map(c => {
    const q = c.quotation.filter(r=>qt.includes(r)), p = c.po.filter(r=>po.includes(r));
    return {c, q, p, v: sumBy(q,'totalRp')+sumBy(p,'totalRp'), n: q.length+p.length};
  }).filter(o=>o.n).sort((a,b)=>b.v-a.v || b.n-a.n).slice(0,10);
  // tren bulanan
  const mm = new Map();
  const addM = (t, r) => { const m = String(r.tanggal||'').slice(0,7); if(!/^\d{4}-\d{2}$/.test(m)) return; if(!mm.has(m)) mm.set(m,{m, qt:[], po:[]}); mm.get(m)[t].push(r); };
  qt.forEach(r=>addM('qt',r)); po.forEach(r=>addM('po',r));

/* ================= RINCIAN (DRILL) & BUKU BESAR ================= */
function openReg(i){ const r = S.reg[i]; if(r) drill(r.title, r.t, r.rows); }
function showDrill(html){
  const d = document.getElementById('drill'); d.innerHTML = `<div class="mbg" onclick="if(event.target===this)closeDrill()"><div class="modal xl">${html}</div></div>`; d.classList.remove('hide');
}
function closeDrill(){ S.stack = []; const d=document.getElementById('drill'); d.classList.add('hide'); d.innerHTML=''; }
function drillBack(){ S.stack.pop(); const p = S.stack[S.stack.length-1]; if(p) p(); else closeDrill(); }
function pushView(fn){ S.stack.push(fn); }
const backBtn = () => S.stack.length>1 ? `<button class="btn sec sm" onclick="drillBack()">${ic('back')} Kembali</button>` : '';

function drill(title, t, rows){
  const fn = () => {
    const sc = S.schema[t], cols = sc.fields.filter(x=>x.list);
    let foot = `<span>Jumlah: <b>${fmtN(rows.length)}</b> baris</span>`;
    if(field(t,'qty')) foot += `<span>Total Qty: <b>${fmtKg(sumBy(rows,'qty'))}</b></span>`;
    if(field(t,'totalRp')) foot += `<span>Total Nilai: <b>${fmtRp(sumBy(rows,'totalRp'))}</b></span>`;
    showDrill(`<div class="mh"><div><b>${esc(title)}</b><small>${esc(sc.title)} · klik baris untuk ubah, klik nama perusahaan untuk buku besar</small></div><div style="display:flex;gap:8px">${backBtn()}<span class="mx" onclick="closeDrill()">${ic('x')}</span></div></div>
      <div class="tw" style="max-height:70vh"><table><thead><tr><th class="n">#</th>${cols.map(c=>`<th class="${c.type==='num'?'n':''}">${esc(c.label)}</th>`).join('')}</tr></thead>
      <tbody>${rows.length?rows.map((r,i)=>`<tr class="ck" onclick="openForm('${t}','${esc(r.id)}')"><td class="n">${i+1}</td>${cols.map(c=>cell(t,c,r)).join('')}</tr>`).join(''):`<tr><td colspan="${cols.length+1}" class="empty">Tidak ada data</td></tr>`}</tbody></table></div>
      <div class="sum">${foot}</div>`);
  };
  pushView(fn); fn();
}

function ledger(name){
  const key = normCo(name);
  const fn = () => {
    const c = companies().find(o=>o.key===key) || {name, sales:new Set(), surat:[], prospect:[], quotation:[], po:[]};
    const ac = key.length>=4 ? (S.data.activity||[]).filter(r => normCo([r.aktivitas,r.hasil,r.catatan,r.tindakLanjut].join(' ')).includes(key)) : [];
    const sec = (t, title, rows) => {
      const sc = S.schema[t], cols = sc.fields.filter(x=>x.list && x.key!=='perusahaan');
      return `<div class="panel" style="box-shadow:none"><div class="ph"><b>${title}</b><small>${rows.length} baris${field(t,'totalRp')?' · '+fmtRp(sumBy(rows,'totalRp')):''}${field(t,'qty')?' · '+fmtKg(sumBy(rows,'qty')):''}</small></div>
        ${rows.length?`<div class="tw"><table><thead><tr>${cols.map(x=>`<th class="${x.type==='num'?'n':''}">${esc(x.label)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr class="ck" onclick="openForm('${t}','${esc(r.id)}')">${cols.map(x=>cell(t,x,r)).join('')}</tr>`).join('')}</tbody></table></div>`:'<div class="empty" style="padding:16px">Belum ada</div>'}</div>`;
    };
    const st = c.surat.some(visited) ? '<span class="badge b-ok">SUDAH DIKUNJUNGI</span>' : (c.surat.length?'<span class="badge b-mut">BELUM DIKUNJUNGI</span>':'');
    showDrill(`<div class="mh"><div><b>Buku Besar — ${esc(c.name)}</b><small>${[...c.sales].map(esc).join(', ')||'–'} ${st}</small></div><div style="display:flex;gap:8px">${backBtn()}<span class="mx" onclick="closeDrill()">${ic('x')}</span></div></div>
      <div class="dbody">
        <div class="kpis" style="grid-template-columns:repeat(auto-fill,minmax(170px,1fr))">
          <div class="kpi" style="cursor:default"><div class="kh">Surat Tugas</div><div class="kv">${c.surat.length}</div></div>
          <div class="kpi" style="cursor:default"><div class="kh">Prospect</div><div class="kv">${c.prospect.length}</div><div class="ks">${fmtKg(sumBy(c.prospect,'qty'))}</div></div>
          <div class="kpi" style="cursor:default"><div class="kh">Quotation</div><div class="kv">${c.quotation.length}</div><div class="ks">${fmtKg(sumBy(c.quotation,'qty'))} · ${fmtRp(sumBy(c.quotation,'totalRp'))}</div></div>
          <div class="kpi" style="cursor:default"><div class="kh">PO</div><div class="kv">${c.po.length}</div><div class="ks">${fmtKg(sumBy(c.po,'qty'))} · ${fmtRp(sumBy(c.po,'totalRp'))}</div></div>
          <div class="kpi" style="cursor:default"><div class="kh">Aktivitas terkait</div><div class="kv">${ac.length}</div></div>
        </div>
        ${sec('surat','Surat Tugas',c.surat)}${sec('prospect','Prospect',c.prospect)}${sec('quotation','Quotation',c.quotation)}${sec('po','PO',c.po)}${sec('activity','Daily Activity yang menyebut perusahaan ini',ac)}
      </div>`);
  };
  pushView(fn); fn();
}

function ledgerRows(){
  const F = fl('ledger'), q = F.q.toLowerCase();

  document.getElementById('tb').innerHTML = list.map((c,i)=>`<tr class="ck" onclick="ledger('${esc(c.name.replace(/\\/g,'\\\\').replace(/'/g,"\\'"))}')"><td class="n">${i+1}</td><td><b>${esc(c.name)}</b></td><td>${[...c.sales].map(esc).join(', ')}</td>

    <td class="n">${c.prospect.length||''}</td><td class="n">${c.quotation.length||''}</td><td class="n">${sumBy(c.quotation,'totalRp')?fmtRp(sumBy(c.quotation,'totalRp')):''}</td><td class="n">${c.po.length||''}</td><td class="n">${fmtN(sumBy(c.po,'qty'))||''}</td><td class="n">${sumBy(c.po,'totalRp')?fmtRp(sumBy(c.po,'totalRp')):''}</td></tr>`).join('') || '<tr><td colspan="10" class="empty">Tidak ada data</td></tr>';
  document.getElementById('sum').innerHTML = `<span>Jumlah: <b>${list.length}</b> perusahaan</span>`;
}

/* ================= DAFTAR DATA PER MENU ================= */
function fl(t){
  if(!S.f[t]) S.f[t] = {q:'', sales:'', pt:'', sk:'', pri:'', kel:''};
  return S.f[t];
}
const EXTRA = { formula: [{key:'_rumus', label:'Rumus', after:'basis', fn: r => rumus(r)}] };
function listCols(t){
  const cols = S.schema[t].fields.filter(x=>x.list);
  (EXTRA[t]||[]).forEach(e => { const i = cols.findIndex(c=>c.key===e.after); cols.splice(i+1, 0, Object.assign({type:'extra'}, e)); });
  return cols;
}

function filtered(t){
  const F = fl(t), q = F.q.toLowerCase().trim();
  return (S.data[t]||[]).filter(r => {
    if(F.sales && String(r.sales||'').trim()!==F.sales) return false;
    if(F.pt && r.pt!==F.pt) return false;
    if(F.kel && r.kelompok!==F.kel) return false;
    if(t==='surat'){ if(F.sk && (r.statusKunjungan||'BELUM DITANDAI')!==F.sk) return false; if(F.pri && r.prioritas!=='Ya') return false; }
    if(q && !Object.values(r).some(v => String(v).toLowerCase().includes(q))) return false;
    return true;
  });
}
function cell(t, c, r){
  if(c.type==='extra') return `<td>${esc(c.fn(r))}</td>`;
  const v = r[c.key];
  if(c.key==='perusahaan' && v) return `<td>${colink(v)}</td>`;
  if(c.type==='num'){
    if(!has(v) && c.key==='hargaRp' && r.hargaTeks) return `<td class="wrap">${esc(r.hargaTeks)}</td>`;
    const d = ['hargaUsd','totalUsd','lmeMin','lmeMax','premium'].includes(c.key) ? 4 : 0;
    return `<td class="n">${fmtN(v,d)}</td>`;
  }
  if(c.type==='date') return `<td>${esc(fmtD(v))}</td>`;
  if(c.type==='check') return `<td>${v==='Ya'?'<span class="badge b-ok">✓</span>':''}</td>`;
  if(c.key==='statusKunjungan') return `<td>${v==='SUDAH DIKUNJUNGI'?'<span class="badge b-ok">SUDAH DIKUNJUNGI</span>':'<span class="badge b-mut">'+esc(v||'BELUM DITANDAI')+'</span>'}</td>`;
  if(c.key==='prioritas') return `<td>${v==='Ya'?'<span class="badge b-pr">PRIORITAS</span>':''}</td>`;
  if(c.key==='basis') return `<td><span class="badge ${v==='Harga Pasar'?'b-pr':'b-bl'}">${esc(v||'LME')}</span></td>`;
  if(c.type==='textarea') return `<td class="wrap">${esc(v).replace(/\n/g,'<br>')}</td>`;
  return `<td>${esc(v)}</td>`;
}
function rows(t){
  const cols = listCols(t), list = filtered(t);
  document.getElementById('tb').innerHTML = list.length
    ? list.map((r,i)=>`<tr class="ck" onclick="openForm('${t}','${esc(r.id)}')"><td class="n">${i+1}</td>${cols.map(c=>cell(t,c,r)).join('')}</tr>`).join('')
    : `<tr><td colspan="${cols.length+1}" class="empty">Tidak ada data</td></tr>`;
  let s = `<span>Jumlah: <b>${fmtN(list.length)}</b> baris</span>`;
  if(field(t,'qty')) s += `<span>Total Qty: <b>${fmtKg(sumBy(list,'qty'))}</b></span>`;
  if(field(t,'totalRp')) s += `<span>Total Nilai: <b>${fmtRp(sumBy(list,'totalRp'))}</b></span>`;
  if(t==='surat') s += `<span>Sudah dikunjungi: <b>${fmtN(list.filter(visited).length)}</b></span>`;
  document.getElementById('sum').innerHTML = s;
}
function refreshView(){
  if(S.page==='dash') renderDash();
  else if(S.page==='ledger') ledgerRows();
  else if(S.page==='report') renderReportBody();
  else if(MENUS[S.page] && !['harga','home'].includes(S.page)) rows(S.page);
  const st = S.stack[S.stack.length-1]; if(st && !document.getElementById('drill').classList.contains('hide')) st();
}

/* ================= FORM ================= */
function openForm(t, id){
  const sc = S.schema[t];
  const r = id ? (S.data[t]||[]).find(x => String(x.id)===String(id)) : null;
  const d = Object.assign({}, r||{});
  if(!r){ const F = fl(t); if(F.sales) d.sales = F.sales; if(F.pt) d.pt = F.pt; if(field(t,'tanggal')) d.tanggal = today(); }
  const inputs = sc.fields.filter(x => x.type!=='id' && x.type!=='auto').map(fd => {
    const v = d[fd.key]==null ? '' : d[fd.key], nm = `name="${fd.key}"`;
    let h;
    if(fd.type==='textarea') h = `<textarea class="inp" ${nm}>${esc(v)}</textarea>`;
    else if(fd.type==='select') h = `<select class="inp" ${nm} onchange="calc('${t}')">${fd.opts.map(o=>`<option value="${esc(o)}" ${String(v)===o?'selected':''}>${o||'–'}</option>`).join('')}${v && !fd.opts.includes(String(v))?`<option selected>${esc(v)}</option>`:''}</select>`;
    else if(fd.type==='check') h = `<div class="chk"><input type="checkbox" ${nm} ${v==='Ya'?'checked':''}> <span>Sudah</span></div>`;
    else if(fd.type==='num') h = `<input class="inp" type="number" step="any" ${nm} value="${esc(v)}" oninput="calc('${t}')">`;
    else if(fd.type==='date') h = `<input class="inp" type="date" ${nm} value="${/^\d{4}-\d{2}-\d{2}$/.test(v)?v:''}">${v && !/^\d{4}-\d{2}-\d{2}$/.test(v) ? `<div class="meta">Data lama: ${esc(v)}</div>`:''}`;
    else if(fd.type==='sales') h = `<input class="inp" ${nm} list="dl_sales" value="${esc(v)}">`;
    else if(fd.key==='alloy') h = `<input class="inp" ${nm} list="dl_alloy" value="${esc(v)}">`;
    else if(fd.key==='kelompok') h = `<input class="inp" ${nm} list="dl_kel" value="${esc(v)}">`;
    else h = `<input class="inp" ${nm} value="${esc(v)}">`;
    return `<div class="${fd.type==='textarea'?'full':''}"><label>${esc(fd.label)}</label>${h}</div>`;
  }).join('') + (t==='formula' ? `<div class="full"><label>Rumus</label><div class="inp" id="rumusPrev" style="background:var(--soft);font-weight:700"></div></div>` : '');
  const alloys = new Set(); ['surat','prospect','quotation','po'].forEach(x => distinct(x,'alloy').forEach(a=>alloys.add(a)));
  const m = document.getElementById('modal');
  m.innerHTML = `<div class="mbg" onclick="if(event.target===this)closeForm()"><div class="modal">
    <div class="mh"><b>${r?'Ubah':'Tambah'} ${esc(sc.title)}</b><span class="mx" onclick="closeForm()">${ic('x')}</span></div>
    <form id="frm" class="mb" onsubmit="return false">${inputs}</form>
    <datalist id="dl_sales">${salesList().map(s=>`<option value="${esc(s)}">`).join('')}</datalist>
    <datalist id="dl_alloy">${[...alloys].sort().map(s=>`<option value="${esc(s)}">`).join('')}</datalist>
    <datalist id="dl_kel">${distinct('formula','kelompok').map(s=>`<option value="${esc(s)}">`).join('')}</datalist>
    <div class="mf">
      ${r ? `<span class="meta l">ID ${esc(r.id)} · diubah ${esc(r.updated||'-')}</span><button class="btn red" onclick="delRow('${t}','${esc(r.id)}')">Hapus</button>` : '<span class="l"></span>'}
      <button class="btn sec" onclick="closeForm()">Batal</button>
      <button class="btn" id="svBtn" onclick="saveRow('${t}','${r?esc(r.id):''}')">${ic('save')} Simpan</button>
    </div></div></div>`;
  m.classList.remove('hide');
  calc(t);
}
function closeForm(){ const m=document.getElementById('modal'); m.classList.add('hide'); m.innerHTML=''; }
function formVals(t){
  const fm = document.getElementById('frm'), o = {};
  S.schema[t].fields.forEach(fd => { const el = fm.elements[fd.key]; if(el) o[fd.key] = fd.type==='check' ? (el.checked?'Ya':'') : el.value.trim(); });
  return o;
}
function calc(t){
  const fm = document.getElementById('frm'); if(!fm) return;
  if(t==='formula'){ const p = document.getElementById('rumusPrev'); if(p) p.textContent = rumus(formVals('formula')); return; }
  if(t!=='quotation' && t!=='po') return;
  const g = k => fm.elements[k] ? fm.elements[k].value : '';
  const qty = Number(g('qty'))||0, ae = document.activeElement && document.activeElement.name;
  if(ae==='totalRp' || ae==='totalUsd') return;
  if(fm.elements.totalRp && qty && Number(g('hargaRp'))) fm.elements.totalRp.value = Math.round(qty*Number(g('hargaRp')));
  if(fm.elements.totalUsd && qty && Number(g('hargaUsd'))) fm.elements.totalUsd.value = +(qty*Number(g('hargaUsd'))).toFixed(4);
}
async function saveRow(t, id){
  const row = Object.assign({id}, formVals(t));
  const req = {formula:'type', activity:'aktivitas'}[t] || 'perusahaan';
  if(!row[req]){ toast(field(t,req).label + ' wajib diisi'); return; }
  const btn = document.getElementById('svBtn'); btn.disabled = true; btn.textContent = 'Menyimpan...';
  try{
    const j = await api('save', {table:t, row});
    const list = S.data[t] || (S.data[t]=[]);
    const i = list.findIndex(x => String(x.id)===String(j.row.id));
    if(i>=0) list[i] = j.row; else list.push(j.row);
    replaceInReg(t, j.row);
    closeForm(); refreshView(); toast('Tersimpan');
  }catch(e){ toast('Gagal: '+e.message); btn.disabled=false; btn.innerHTML=ic('save')+' Simpan'; }
}
function replaceInReg(t, row){ S.reg.forEach(g => { if(g.t!==t) return; const i = g.rows.findIndex(x=>String(x.id)===String(row.id)); if(i>=0) g.rows[i] = row; }); }
async function delRow(t, id){
  if(!confirm('Hapus data ini dari Sheet?')) return;
  try{
    await api('delete', {table:t, id});
    S.data[t] = (S.data[t]||[]).filter(x => String(x.id)!==String(id));
    S.reg.forEach(g => { if(g.t!==t) return; const i = g.rows.findIndex(x=>String(x.id)===String(id)); if(i>=0) g.rows.splice(i,1); });
    closeForm(); refreshView(); toast('Dihapus');
  }catch(e){ toast('Gagal: '+e.message); }
}

/* ================= UPDATE HARGA PRODUK ================= */
function hargaDates(){ return distinct('harga','tanggal').filter(d=>/^\d{4}-\d{2}-\d{2}$/.test(d)).sort().reverse(); }
function loadHarga(tg){
  const saved = (S.data.harga||[]).filter(r=>r.tanggal===tg);
  const prev = hargaDates().find(d => d < tg);
  const base = saved[0] || (prev ? (S.data.harga||[]).find(r=>r.tanggal===prev) : null) || {};
  const inp = {};
  saved.forEach(r => { if(r.formulaId) inp[r.formulaId] = {qty:r.qty, cost:r.cost, rp: r.hargaRpMin}; });
  S.h = {tanggal:tg, lme: base.lme||'', mjp: base.mjp||'', kurs: base.kurs||'', inp, saved: saved.length>0, kel: S.h ? S.h.kel : '', pt: S.h ? S.h.pt : ''};
}
function hargaRows(all){
  const H = S.h;
  return (S.data.formula||[]).filter(fm => all || ((!H.kel || fm.kelompok===H.kel) && (!H.pt || fm.pt===H.pt))).map(fm => {
    const inp = H.inp[fm.id] || {};
    const c = hitung(fm, H.lme, H.mjp, H.kurs);
    if(fm.basis==='Harga Pasar'){ c.hargaRpMin = has(inp.rp) ? Number(inp.rp) : ''; c.hargaRpMax = ''; }
    const margin = has(inp.cost) && has(c.hargaRpMin) ? c.hargaRpMin - Number(inp.cost) : '';
    return Object.assign({formulaId:fm.id, kelompok:fm.kelompok, produk:fm.type, remarks:fm.remarks, pt:fm.pt, rumus:rumus(fm), basis:fm.basis,
      qty: has(inp.qty)?Number(inp.qty):'', cost: has(inp.cost)?Number(inp.cost):'', margin}, c);
  });
}
function renderHarga(){
  if(!S.h){ loadHarga(hargaDates()[0] || today()); }
  const H = S.h, dates = hargaDates();
  document.getElementById('content').innerHTML = `
    <div class="bar">
      <input type="date" class="inp" value="${H.tanggal}" onchange="loadHarga(this.value);renderHarga()">
      <select class="inp" onchange="if(this.value){loadHarga(this.value);renderHarga()}"><option value="">Tanggal tersimpan (${dates.length})</option>${dates.map(d=>`<option value="${d}" ${d===H.tanggal?'selected':''}>${fmtD(d)}</option>`).join('')}</select>
      <select class="inp" onchange="S.h.kel=this.value;renderHarga()"><option value="">Semua Kelompok</option>${distinct('formula','kelompok').map(k=>`<option ${H.kel===k?'selected':''}>${esc(k)}</option>`).join('')}</select>
      <select class="inp" onchange="S.h.pt=this.value;renderHarga()"><option value="">Semua PT</option>${['GAN','SWM'].map(p=>`<option ${H.pt===p?'selected':''}>${p}</option>`).join('')}</select>
      <span style="flex:1"></span>
      <button class="btn sec" onclick="exportHarga('png')">${ic('image')} PNG</button>
      <button class="btn sec" onclick="exportHarga('pdf')">${ic('pdf')} PDF</button>
      <button class="btn" id="hsBtn" onclick="saveHarga()">${ic('save')} Simpan Harga</button>
    </div>
    <div class="note">${H.saved?`Harga tanggal ${fmtD(H.tanggal)} sudah tersimpan. Ubah angka lalu Simpan untuk memperbarui.`:`Harga tanggal ${fmtD(H.tanggal)} <b>belum disimpan</b>${H.lme?' — LME, MJP, Kurs diisi dari tanggal sebelumnya':''}. Isi lalu klik Simpan Harga.`}</div>
    <div class="panel"><div class="ph"><b>Data Pasar ${tglPanjang(H.tanggal)}</b><small>Harga $/MT = LME × %LME + MJP (jika dipakai) + Premium · Rp/kg = $/MT × Kurs ÷ 1000</small></div>
      <div class="hin">
        <div><label>LME Spot ($/MT)</label><input class="inp" type="number" step="any" value="${esc(H.lme)}" oninput="S.h.lme=this.value;hargaBody()"></div>
        <div><label>MJP ($/MT)</label><input class="inp" type="number" step="any" value="${esc(H.mjp)}" oninput="S.h.mjp=this.value;hargaBody()"></div>
        <div><label>Kurs $ → Rp</label><input class="inp" type="number" step="any" value="${esc(H.kurs)}" oninput="S.h.kurs=this.value;hargaBody()"></div>
        <div><label>Produk di formula</label><div class="inp" style="background:var(--soft);font-weight:800">${(S.data.formula||[]).length} produk</div></div>
      </div></div>
    <div class="panel"><div class="tw lim"><table>
      <thead><tr><th>Kelompok</th><th>Produk</th><th>Remarks</th><th>PT</th><th>Rumus</th><th class="n">Harga $/MT</th><th class="n">Harga Rp/kg</th><th class="n">Qty</th><th class="n">Cost (Rp/kg)</th><th class="n">Margin (Rp/kg)</th></tr></thead>
      <tbody id="hb"></tbody></table></div><div class="sum"><span>Produk dan rumus diatur di menu <span class="lk" onclick="go('formula')">Formula Harga</span>. Tipe "Harga Pasar" diisi manual di kolom Harga Rp/kg.</span></div></div>`;
  hargaBody();
}
function setInp(id, k, v){ const H = S.h; if(!H.inp[id]) H.inp[id] = {}; H.inp[id][k] = v; hargaCalcRow(id); }
function hargaBody(){
  const rows = hargaRows(false);
  document.getElementById('hb').innerHTML = rows.length ? rows.map(r=>`<tr id="hr_${esc(r.formulaId)}">
    <td>${esc(r.kelompok)}</td><td><b>${esc(r.produk)}</b></td><td>${esc(r.remarks)}</td><td>${esc(r.pt)}</td><td>${esc(r.rumus)}</td>
    <td class="n" data-k="usd">${rangeTxt(r.hargaUsdMin, r.hargaUsdMax, 2)}</td>
    <td class="n" data-k="rp">${r.basis==='Harga Pasar' ? `<input class="inp" type="number" step="any" value="${esc(r.hargaRpMin)}" oninput="setInp('${esc(r.formulaId)}','rp',this.value)">` : `<b>${rangeTxt(r.hargaRpMin, r.hargaRpMax)}</b>`}</td>
    <td class="n"><input class="inp" type="number" step="any" value="${esc(r.qty)}" oninput="setInp('${esc(r.formulaId)}','qty',this.value)"></td>
    <td class="n"><input class="inp" type="number" step="any" value="${esc(r.cost)}" oninput="setInp('${esc(r.formulaId)}','cost',this.value)"></td>
    <td class="n" data-k="mg">${marginTxt(r.margin)}</td></tr>`).join('')
    : `<tr><td colspan="10" class="empty">Belum ada produk. Tambahkan di menu <span class="lk" onclick="go('formula')">Formula Harga</span>.</td></tr>`;
}
const marginTxt = m => !has(m) ? '' : `<b style="color:${m<0?'var(--bad)':'var(--ok)'}">${fmtN(m)}</b>`;
function hargaCalcRow(id){
  const r = hargaRows(true).find(x=>x.formulaId===id), tr = document.getElementById('hr_'+id); if(!r||!tr) return;
  tr.querySelector('[data-k="mg"]').innerHTML = marginTxt(r.margin);
}
async function saveHarga(){
  const H = S.h;
  if(!num(H.lme) || !num(H.kurs)){ toast('Isi LME Spot dan Kurs dulu'); return; }
  const rows = hargaRows(true).map(r => { const o = Object.assign({}, r, {tanggal:H.tanggal, lme:H.lme, mjp:H.mjp, kurs:H.kurs}); delete o.basis; return o; });
  const btn = document.getElementById('hsBtn'); btn.disabled = true; btn.textContent = 'Menyimpan...';
  try{
    const j = await api('saveHarga', {tanggal:H.tanggal, rows});
    S.data.harga = (S.data.harga||[]).filter(r=>r.tanggal!==H.tanggal).concat(j.rows);
    H.saved = true; renderHarga(); toast('Harga '+fmtD(H.tanggal)+' tersimpan');
  }catch(e){ toast('Gagal: '+e.message); btn.disabled=false; btn.innerHTML=ic('save')+' Simpan Harga'; }
}

      <div><small>Surat Tugas</small><b>${fmtN(su.length)}</b><span>${fmtN(sv.length)} dikunjungi</span></div>
      <div><small>Prospect</small><b>${fmtN(pr.length)}</b><span>${fmtKg(sumBy(pr,'qty'))}</span></div>
      <div><small>Quotation</small><b>${fmtN(qt.length)}</b><span>${fmtKg(sumBy(qt,'qty'))}<br>${fmtRp(sumBy(qt,'totalRp'))}</span></div>
      <div><small>PO</small><b>${fmtN(po.length)}</b><span>${fmtKg(sumBy(po,'qty'))}<br>${fmtRp(sumBy(po,'totalRp'))}</span></div>
      <div><small>Aktivitas</small><b>${fmtN(ac.length)}</b><span>${new Set(ac.map(r=>r.tanggal)).size} hari</span></div></div>
      <table style="margin-top:10px"><thead><tr><th>Sales</th><th class="n">Surat Tugas</th><th class="n">Dikunjungi</th><th class="n">Prospect</th><th class="n">Quotation</th><th class="n">Nilai Quotation</th><th class="n">PO</th><th class="n">Qty PO</th><th class="n">Nilai PO</th><th class="n">Aktivitas</th></tr></thead><tbody>
      ${sales.map(s=>{const f=r=>String(r.sales||'').trim()===s, a=su.filter(f), q=qt.filter(f), p=po.filter(f);
        return `<tr><td><b>${esc(s)}</b></td><td class="n">${a.length}</td><td class="n">${a.filter(visited).length}</td><td class="n">${pr.filter(f).length}</td><td class="n">${q.length}</td><td class="n">${fmtRp(sumBy(q,'totalRp'))}</td><td class="n">${p.length}</td><td class="n">${fmtN(sumBy(p,'qty'))}</td><td class="n">${fmtRp(sumBy(p,'totalRp'))}</td><td class="n">${ac.filter(f).length}</td></tr>`;}).join('')}</tbody></table>`;
  }
  if(R.sec.act){
    const list = [...ac].sort((a,b)=>String(a.tanggal).localeCompare(String(b.tanggal)));
    h += `<h2>2. Daily Activity</h2><table><thead><tr><th>Tanggal</th><th>Sales</th><th>Aktivitas</th><th>Hasil</th><th>Status</th><th>Kendala</th><th>Tindak Lanjut</th></tr></thead><tbody>
      ${list.map(r=>`<tr><td>${fmtD(r.tanggal)}</td><td>${esc(r.sales)}</td><td>${esc(r.aktivitas)}</td><td>${esc(r.hasil)}</td><td>${esc(r.status)}</td><td>${esc(r.kendala)}</td><td>${esc(r.tindakLanjut)}</td></tr>`).join('')||'<tr><td colspan="7">Tidak ada aktivitas di periode ini</td></tr>'}</tbody></table>`;
  }
  if(R.sec.harga){
    const d = hargaDates().find(x => x <= R.to);
    h += `<h2>3. Daftar Harga</h2>`;
    if(d){ const rows = (S.data.harga||[]).filter(r=>r.tanggal===d); const b = rows[0]||{}; h += priceSection(d, b.lme, b.mjp, b.kurs, rows); }
    else h += `<div>Belum ada harga tersimpan sampai ${tglPanjang(R.to)}.</div>`;
  }
  if(R.sec.qp){
    const qs = [...qt].sort((a,b)=>String(b.tanggal).localeCompare(String(a.tanggal))), ps = [...po].sort((a,b)=>String(b.tanggal).localeCompare(String(a.tanggal)));
    h += `<h2>4. Quotation</h2><table><thead><tr><th>Tanggal</th><th>Sales</th><th>PT</th><th>No.</th><th>Perusahaan</th><th>Alloy</th><th class="n">Qty (kg)</th><th class="n">Harga Rp/kg</th><th class="n">Total</th><th>Info</th></tr></thead><tbody>
      ${qs.map(r=>`<tr><td>${fmtD(r.tanggal)}</td><td>${esc(r.sales)}</td><td>${esc(r.pt)}</td><td>${esc(r.noQuotation).replace(/\//g,'/<wbr>')}</td><td>${esc(r.perusahaan)}</td><td>${esc(r.alloy)}</td><td class="n">${fmtN(r.qty)}</td><td class="n">${has(r.hargaRp)?fmtN(r.hargaRp):esc(r.hargaTeks)}</td><td class="n">${fmtN(r.totalRp)}</td><td>${esc(r.information)}</td></tr>`).join('')||'<tr><td colspan="10">Tidak ada quotation di periode ini</td></tr>'}</tbody>
      ${qs.length?`<tfoot><tr><td colspan="6">Total</td><td class="n">${fmtN(sumBy(qs,'qty'))}</td><td></td><td class="n">${fmtN(sumBy(qs,'totalRp'))}</td><td></td></tr></tfoot>`:''}</table>
      <h2>5. PO</h2><table><thead><tr><th>Tanggal</th><th>PIC</th><th>PT</th><th>No. PO</th><th>Perusahaan</th><th>Alloy</th><th class="n">Qty (kg)</th><th class="n">Harga Rp/kg</th><th class="n">Total</th><th>Delivery</th></tr></thead><tbody>
      ${ps.map(r=>`<tr><td>${fmtD(r.tanggal)}</td><td>${esc(r.sales)}</td><td>${esc(r.pt)}</td><td>${esc(r.noPo).replace(/\//g,'/<wbr>')}</td><td>${esc(r.perusahaan)}</td><td>${esc(r.alloy)}</td><td class="n">${fmtN(r.qty)}</td><td class="n">${fmtN(r.hargaRp)}</td><td class="n">${fmtN(r.totalRp)}</td><td>${esc(r.delivery)}</td></tr>`).join('')||'<tr><td colspan="10">Tidak ada PO di periode ini</td></tr>'}</tbody>
      ${ps.length?`<tfoot><tr><td colspan="6">Total</td><td class="n">${fmtN(sumBy(ps,'qty'))}</td><td></td><td class="n">${fmtN(sumBy(ps,'totalRp'))}</td><td></td></tr></tfoot>`:''}</table>`;
  }
  h += `<div class="rf"><span>Data tanpa tanggal tidak masuk periode. Surat Tugas ditampilkan seluruhnya.</span><span>Sales Report · Back Office</span></div></div>`;
  return h;
}

/* ================= EKSPOR PDF / PNG ================= */
function loadScript(src){ return new Promise((ok, no) => { if(document.querySelector(`script[src="${src}"]`)) return ok(); const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => no(new Error('Gagal memuat '+src)); document.head.appendChild(s); }); }
async function exportHtml(html, name, kind){
  toast('Menyiapkan ' + kind.toUpperCase() + '...');
  try{
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
    if(kind==='pdf') await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
    const holder = document.createElement('div');
    holder.style.cssText = 'position:fixed;left:-10000px;top:0;background:#fff';
    holder.innerHTML = html; document.body.appendChild(holder);
    const el = holder.firstElementChild;
    if(document.fonts && document.fonts.ready) await document.fonts.ready;
    const canvas = await html2canvas(el, {scale:2, backgroundColor:'#ffffff', useCORS:true});
    document.body.removeChild(holder);
    if(kind==='png'){
      canvas.toBlob(b => saveBlob(b, name+'.png', canvas), 'image/png');
    } else {
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF('p','mm','a4');
      const pw = 210, ph = 297, pxPerMm = canvas.width / pw, pagePx = Math.floor(ph * pxPerMm);
      // potong per halaman, usahakan di garis putih (antar baris)
      const ctx = canvas.getContext('2d');
      let y = 0, page = 0;
      while(y < canvas.height){
        let end = Math.min(y + pagePx, canvas.height);
        if(end < canvas.height){
          for(let yy = end; yy > end - pagePx*0.25; yy--){
            const row = ctx.getImageData(0, yy, canvas.width, 1).data; let white = true;
            for(let i = 0; i < row.length; i += 16){ if(row[i] < 245 || row[i+1] < 245 || row[i+2] < 245){ white = false; break; } }
            if(white){ end = yy; break; }
          }
        }
        const part = document.createElement('canvas'); part.width = canvas.width; part.height = end - y;
        part.getContext('2d').drawImage(canvas, 0, y, canvas.width, end - y, 0, 0, canvas.width, end - y);
        if(page) pdf.addPage();
        pdf.addImage(part.toDataURL('image/jpeg', 0.92), 'JPEG', 0, 0, pw, (end - y) / pxPerMm);
        y = end; page++;
      }
      saveBlob(pdf.output('blob'), name+'.pdf', canvas);
    }
  }catch(e){ toast('Gagal: ' + e.message); }
}
function saveBlob(blob, filename){
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  toast('Terunduh: ' + filename);
}
